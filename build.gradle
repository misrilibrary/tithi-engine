plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.0.9'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.misrilibrary'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jar.dependsOn test

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'tithi-engine'
                description = 'Pure Java library for Hindu lunar calendar (tithi/panchang) calculations'
                url = 'https://github.com/misrilibrary/tithi-engine'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'sumeetmisri'
                        name = 'Sumeet Misri'
                        email = 'misrilibrary@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/misrilibrary/tithi-engine.git'
                    developerConnection = 'scm:git:ssh://github.com/misrilibrary/tithi-engine.git'
                    url = 'https://github.com/misrilibrary/tithi-engine'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'OSSRH'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = findProperty('ossrhUsername') ?: ''
                password = findProperty('ossrhPassword') ?: ''
            }
        }
    }
}

signing {
    def signingKey = findProperty('signingKey')
    if (signingKey) {
        useInMemoryPgpKeys(findProperty('signingKeyId'), signingKey, findProperty('signingPassword'))
    }
    sign publishing.publications.mavenJava
    required { gradle.taskGraph.hasTask('publish') }
}

import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

spotbugs {
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = false
    }
}

spotbugsTest.enabled = false
